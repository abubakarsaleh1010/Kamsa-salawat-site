<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Campaign Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A2624; --panel:#123F3A; --gold:#C9A24B; --gold-bright:#EBCB84;
    --ivory:#F4EFE2; --line:rgba(201,162,75,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ivory);
    font-family:'Manrope',sans-serif; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:40px; width:100%; max-width:440px;
  }
  h1{font-family:'Cormorant Garamond',serif; font-size:1.7rem; margin:0 0 6px; color:var(--gold-bright);}
  p.sub{margin:0 0 28px; font-size:0.85rem; color:rgba(244,239,226,0.6);}
  label{display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; color:rgba(244,239,226,0.6);}
  input[type=password], select{
    width:100%; padding:12px 14px; margin-bottom:22px; border-radius:4px;
    border:1px solid var(--line); background:rgba(0,0,0,0.15); color:var(--ivory); font-size:0.95rem;
  }
  .stage-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .stage-btn{
    padding:14px 10px; border:1px solid var(--line); border-radius:4px; background:transparent;
    color:var(--ivory); cursor:pointer; font-size:0.85rem; transition:all .2s;
  }
  .stage-btn.selected{ border-color:var(--gold); background:rgba(201,162,75,0.15); color:var(--gold-bright); }
  button.save{
    width:100%; padding:14px; background:var(--gold); color:var(--bg); border:none; border-radius:4px;
    font-weight:700; letter-spacing:0.04em; text-transform:uppercase; font-size:0.85rem; cursor:pointer;
  }
  button.save:hover{ background:var(--gold-bright); }
  .status{margin-top:18px; font-size:0.85rem; text-align:center; min-height:20px;}
  .status.ok{color:#8FD19E;}
  .status.err{color:#E19A9A;}
  .current{margin-top:26px; padding-top:20px; border-top:1px solid var(--line); font-size:0.85rem; color:rgba(244,239,226,0.6); text-align:center;}
</style>
</head>
<body>
  <div class="card">
    <h1>Campaign Progress</h1>
    <p class="sub">Update the public stage shown on the fundraiser site. Changes appear immediately — no redeploy needed.</p>

    <label for="pw">Admin password</label>
    <input type="password" id="pw" placeholder="Enter password">

    <label>Select current stage</label>
    <div class="stage-options" id="stage-options">
      <button class="stage-btn" data-percent="20">Foundation</button>
      <button class="stage-btn" data-percent="50">Roofing</button>
      <button class="stage-btn" data-percent="85">Finishing</button>
      <button class="stage-btn" data-percent="100">Complete</button>
    </div>

    <button class="save" id="save-btn">Update Site</button>
    <div class="status" id="status"></div>
    <div class="current" id="current">Loading current stage…</div>
  </div>

<script>
  const buttons = document.querySelectorAll('.stage-btn');
  const statusEl = document.getElementById('status');
  const currentEl = document.getElementById('current');
  let selectedPercent = null;

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPercent = parseFloat(btn.dataset.percent);
    });
  });

  function stageLabel(p){
    if(p >= 100) return 'Complete';
    if(p >= 71) return 'Finishing';
    if(p >= 34) return 'Roofing';
    return 'Foundation';
  }

  async function loadCurrent(){
    try{
      const res = await fetch('/.netlify/functions/get-stage', {cache:'no-store'});
      const rawText = await res.text();
      let data;
      try{ data = JSON.parse(rawText); }catch{ data = null; }
      if(!res.ok || !data){
        currentEl.textContent = 'Could not load current stage — HTTP ' + res.status + ': ' + rawText.slice(0,200);
        return;
      }
      currentEl.textContent = 'Current live stage: ' + stageLabel(data.percent);
    }catch(e){
      currentEl.textContent = 'Could not load current stage: ' + e.message;
    }
  }
  loadCurrent();

  document.getElementById('save-btn').addEventListener('click', async ()=>{
    const password = document.getElementById('pw').value;
    if(!password){ statusEl.textContent = 'Enter the admin password.'; statusEl.className='status err'; return; }
    if(selectedPercent === null){ statusEl.textContent = 'Select a stage first.'; statusEl.className='status err'; return; }

    statusEl.textContent = 'Saving…'; statusEl.className='status';
    try{
      const res = await fetch('/.netlify/functions/set-stage', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password, percent: selectedPercent })
      });
      const rawText = await res.text();
      let data;
      try{ data = JSON.parse(rawText); }catch{ data = null; }

      if(!res.ok){
        const detail = (data && data.error) ? data.error : rawText;
        throw new Error('HTTP ' + res.status + ' — ' + detail);
      }
      statusEl.textContent = 'Saved! The site now shows: ' + stageLabel(selectedPercent);
      statusEl.className = 'status ok';
      loadCurrent();
    }catch(e){
      statusEl.innerHTML = 'Error: ' + e.message.replace(/</g,'&lt;');
      statusEl.className = 'status err';
    }
  });
</script>
</body>
</html>
